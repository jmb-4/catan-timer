<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30 Second Party Game</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f4f3ef;
    color: #1a1a18;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 24px;
  }
  .player-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    font-size: 14px;
    color: #666;
  }
  .timer-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }
  .timer-num {
    font-size: 48px;
    font-weight: 700;
    min-width: 90px;
  }
  .bar-track {
    flex: 1;
    height: 10px;
    background: #e5e3db;
    border-radius: 5px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 100%;
    background: #3878d8;
    transition: width 1s linear, background 0.3s;
  }
  .bar-fill.low { background: #d84545; }
  .buttons {
    display: flex;
    gap: 10px;
  }
  button {
    flex: 1;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #startBtn {
    background: #1a1a18;
    color: #fff;
  }
  #startBtn:disabled {
    background: #999;
  }
  #nextBtn {
    background: #fff;
    color: #1a1a18;
    border: 1px solid #d5d3c9;
  }
  .times-up {
    color: #d84545;
  }
</style>
</head>
<body>
<div class="card">
  <h1>30 second party game</h1>
  <div class="player-row">
    <span id="playerLabel">Player 1</span>
  </div>
  <div class="timer-row">
    <div class="timer-num" id="timer">30</div>
    <div class="bar-track">
      <div class="bar-fill" id="bar"></div>
    </div>
  </div>
  <div class="buttons">
    <button id="startBtn" onclick="startTimer()">Start</button>
    <button id="nextBtn" onclick="nextPlayer()">Next player</button>
  </div>
</div>

<script>
let playerNum = 1;
let timeLeft = 30;
let timerInterval = null;

function newTurn(){
  document.getElementById('playerLabel').textContent = 'Player ' + playerNum;
  clearInterval(timerInterval);
  timeLeft = 30;
  const timerEl = document.getElementById('timer');
  const barEl = document.getElementById('bar');
  timerEl.textContent = timeLeft;
  timerEl.classList.remove('times-up');
  barEl.style.width = '100%';
  barEl.classList.remove('low');
  const startBtn = document.getElementById('startBtn');
  startBtn.textContent = 'Start';
  startBtn.disabled = false;
}

function startTimer(){
  const startBtn = document.getElementById('startBtn');
  startBtn.disabled = true;
  startBtn.textContent = 'Running';
  timerInterval = setInterval(()=>{
    timeLeft--;
    const clamped = Math.max(timeLeft,0);
    const timerEl = document.getElementById('timer');
    const barEl = document.getElementById('bar');
    timerEl.textContent = clamped;
    barEl.style.width = (clamped/30*100) + '%';
    if(clamped <= 10){ barEl.classList.add('low'); }
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      timerEl.textContent = "Time's up";
      timerEl.classList.add('times-up');
      startBtn.textContent = "Time's up";
    }
  },1000);
}

function nextPlayer(){
  playerNum++;
  newTurn();
}

newTurn();
</script>
</body>
</html>
